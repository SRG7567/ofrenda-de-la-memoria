<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #0b0518 url('../assets/fondo-ofrenda.jpg') center bottom/cover; padding: 20px; font-family: sans-serif; }
  .header-preview {
    background: rgba(18, 9, 36, 0.40);
    backdrop-filter: blur(12px) saturate(130%);
    border: 1px solid rgba(179, 136, 255, 0.22);
    padding: 12px 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-moon { width: 38px; height: 38px; filter: drop-shadow(0 0 8px rgba(255, 235, 175, 0.65)); }
  .site-title { font-size: 20px; margin: 0; color: #FFF; font-weight: bold; }
  .site-subtitle { font-size: 12px; margin: 0; color: #C5BFD6; }
</style>
</head>
<body>
  <div class="header-preview">
    <svg class="brand-moon" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M 35 21.32 A 15 15 0 1 1 18.68 5 A 11.67 11.67 0 0 0 35 21.32 Z" fill="#F3E3C3" />
    </svg>
    <div>
      <h1 class="site-title">Ofrenda de la Memoria (Abre hacia el texto)</h1>
      <p class="site-subtitle">Árbol genealógico familiar · Una vela por cada historia</p>
    </div>
  </div>

  <div class="header-preview">
    <svg class="brand-moon" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M 5 21.32 A 15 15 0 1 0 21.32 5 A 11.67 11.67 0 0 1 5 21.32 Z" fill="#F3E3C3" />
    </svg>
    <div>
      <h1 class="site-title">Ofrenda de la Memoria (Orientación previa)</h1>
      <p class="site-subtitle">Árbol genealógico familiar · Una vela por cada historia</p>
    </div>
  </div>
</body>
</html>
