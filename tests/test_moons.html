<!DOCTYPE html>
<html>
<head>
<style>
  body { background: linear-gradient(135deg, #110924, #241747); padding: 40px; display: flex; gap: 40px; }
  .box { display: flex; flex-direction: column; align-items: center; color: white; font-family: sans-serif; font-size: 13px; }
  svg { width: 40px; height: 40px; }
</style>
</head>
<body>
  <div class='box'>
    <span>Original circles (buggy)</span>
    <svg viewBox='0 0 40 40'>
      <circle cx='20' cy='20' r='15' fill='#FFE5A3' opacity='0.9'/>
      <circle cx='16' cy='17' r='14' fill='#1A1033'/>
    </svg>
  </div>
  <div class='box'>
    <span>Feather Standard</span>
    <svg viewBox='0 0 40 40'>
      <path d='M 35 21.32 A 15 15 0 1 1 18.68 5 A 11.67 11.67 0 0 0 35 21.32 Z' fill='var(--cera, #F3E3C3)' style='filter: drop-shadow(0 0 6px rgba(255, 235, 175, 0.65));' />
    </svg>
  </div>
  <div class='box'>
    <span>Facing Left (matches orig)</span>
    <svg viewBox='0 0 40 40'>
      <!-- Flipped horizontally around x=20 -->
      <path d='M 5 21.32 A 15 15 0 1 0 21.32 5 A 11.67 11.67 0 0 1 5 21.32 Z' fill='var(--cera, #F3E3C3)' style='filter: drop-shadow(0 0 6px rgba(255, 235, 175, 0.65));' />
    </svg>
  </div>
  <div class='box'>
    <span>Harmonious Waxing</span>
    <svg viewBox='0 0 40 40'>
      <path d='M 20 5 A 15 15 0 0 1 20 35 A 16 16 0 0 0 20 5 Z' fill='var(--cera, #F3E3C3)' style='filter: drop-shadow(0 0 6px rgba(255, 235, 175, 0.65));' />
    </svg>
  </div>
</body>
</html>
